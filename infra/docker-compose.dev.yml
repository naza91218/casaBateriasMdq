# Servicios de apoyo para DESARROLLO. El backend y el frontend se corren aparte con `pnpm dev`.
#
# Comandos:
#   docker compose -f infra/docker-compose.dev.yml up -d     → levanta todo en segundo plano
#   docker compose -f infra/docker-compose.dev.yml down      → apaga (los datos quedan guardados)
#   docker compose -f infra/docker-compose.dev.yml down -v   → apaga y BORRA la base (empezar de cero)

services:
  # PostgreSQL 17, la misma versión que en staging y producción.
  db:
    image: postgres:17
    ports:
      - '5433:5432' # 5433 en la PC para no chocar con otro PostgreSQL instalado
    environment:
      POSTGRES_USER: casa
      POSTGRES_PASSWORD: casa
      POSTGRES_DB: casa_dev
    volumes:
      - db-data:/var/lib/postgresql/data
      # Crea también la base de pruebas (casa_test) la primera vez.
      - ./postgres/init-dev.sql:/docker-entrypoint-initdb.d/init-dev.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U casa -d casa_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  # Mailpit: atrapa todos los mails que manda el backend. Se ven en http://localhost:8025
  # y nunca salen a internet.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP (el backend envía acá)
      - '8025:8025' # Bandeja web

volumes:
  db-data:
