# Producción: /etc/nginx/sites-available/casa-produccion (enlazado en sites-enabled).
# Certificado: certbot --nginx -d lacasadelasbaterias.com.ar -d www.lacasadelasbaterias.com.ar

server {
    listen 80;
    listen [::]:80;
    server_name lacasadelasbaterias.com.ar www.lacasadelasbaterias.com.ar;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://lacasadelasbaterias.com.ar$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lacasadelasbaterias.com.ar;
    ssl_certificate     /etc/letsencrypt/live/lacasadelasbaterias.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lacasadelasbaterias.com.ar/privkey.pem;
    return 301 https://lacasadelasbaterias.com.ar$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lacasadelasbaterias.com.ar;
    ssl_certificate     /etc/letsencrypt/live/lacasadelasbaterias.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lacasadelasbaterias.com.ar/privkey.pem;

    set $api 4000;
    set $web 3000;
    include /etc/nginx/casa/comun.conf;
}
