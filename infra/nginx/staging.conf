# Staging: /etc/nginx/sites-available/casa-staging. Con clave y fuera de Google (noindex).
# Clave: htpasswd -c /etc/nginx/casa/staging.htpasswd cliente   (apt install apache2-utils)
# Certificado: certbot --nginx -d staging.lacasadelasbaterias.com.ar

server {
    listen 80;
    listen [::]:80;
    server_name staging.lacasadelasbaterias.com.ar;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.lacasadelasbaterias.com.ar;
    ssl_certificate     /etc/letsencrypt/live/staging.lacasadelasbaterias.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.lacasadelasbaterias.com.ar/privkey.pem;

    auth_basic "Staging";
    auth_basic_user_file /etc/nginx/casa/staging.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow" always;

    set $api 4001;
    set $web 3001;

    # Sin clave: los avisos de Mercado Pago, la revalidación que pide el backend (las dos con su
    # propio secreto) y el chequeo del monitor.
    location = /api/v1/webhooks/mercadopago { auth_basic off; proxy_pass http://127.0.0.1:$api; }
    location = /api/v1/salud         { auth_basic off; proxy_pass http://127.0.0.1:$api; }
    location = /api/revalidate       { auth_basic off; proxy_pass http://127.0.0.1:$web; }

    include /etc/nginx/casa/comun.conf;
}
