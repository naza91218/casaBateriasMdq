# Lo compartido por producción y staging (T127). Se incluye dentro de cada server { listen 443 }.
# $api y $web los define cada sitio: el puerto del backend y del frontend en 127.0.0.1.

client_max_body_size 10m;   # fotos de productos y planillas de importación
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# API (incluye el webhook de Mercado Pago y las fotos guardadas en disco).
location /api/v1/ {
    proxy_pass http://127.0.0.1:$api;
}
location /uploads/ {
    proxy_pass http://127.0.0.1:$api;
    expires 30d;
}

# Archivos de Next con hash en el nombre: se pueden guardar para siempre.
location /_next/static/ {
    proxy_pass http://127.0.0.1:$web;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location / {
    proxy_pass http://127.0.0.1:$web;
}
