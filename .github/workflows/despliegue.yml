# Pasos comunes de deploy-staging y deploy-prod (T129): construye las dos imágenes, las sube a
# GHCR con la etiqueta del commit y despliega por SSH. Si algo falla, el entorno queda como estaba.
name: Despliegue

on:
  workflow_call:
    inputs:
      entorno:
        type: string
        required: true

jobs:
  imagenes:
    runs-on: ubuntu-latest
    environment: ${{ inputs.entorno }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de las imágenes
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/casa" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGEN }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      # Las NEXT_PUBLIC_* van fijas en la imagen: por eso cada entorno tiene la suya.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGEN }}-frontend-${{ inputs.entorno }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITIO_URL=${{ vars.SITIO_URL }}
            NEXT_PUBLIC_GA4_ID=${{ vars.GA4_ID }}
            NEXT_PUBLIC_META_PIXEL_ID=${{ vars.META_PIXEL_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  desplegar:
    needs: imagenes
    runs-on: ubuntu-latest
    environment: ${{ inputs.entorno }}
    concurrency: deploy-${{ inputs.entorno }}
    steps:
      - uses: actions/checkout@v4
      - name: Clave SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          # Sin \r: una clave copiada desde Windows trae fines de línea CRLF y ssh la rechaza.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null || { echo "::error::SSH_KEY no es una clave privada válida"; exit 1; }
          # El VPS escucha SSH en un puerto propio (variable SSH_PORT; 22 si no está).
          {
            echo "Host servidor"
            echo "  HostName ${{ secrets.SSH_HOST }}"
            echo "  User ${{ secrets.SSH_USER }}"
            echo "  Port ${{ vars.SSH_PORT || '22' }}"
          } > ~/.ssh/config
      - name: Copiar compose y scripts
        run: |
          scp infra/docker-compose.yml "servidor:/srv/casa/${{ inputs.entorno }}/docker-compose.yml"
          scp infra/scripts/*.sh "servidor:/srv/casa/scripts/"
      - name: Desplegar
        run: |
          ssh servidor \
            "/srv/casa/scripts/deploy.sh ${{ inputs.entorno }} ${{ github.sha }}"
